name: qtaim_embed
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Everything else is installed from pip. pip torch wheels are manylinux builds
  # that load the system libstdc++; conda C++ libs (rdkit/scipy/sklearn/pyarrow)
  # require a newer libstdc++ and crash with CXXABI/GLIBCXX errors once torch is
  # imported in the same process. Using pip wheels for the whole stack avoids the
  # conda/pip libstdc++ ABI split.
  - pip:
      # torch 2.11 with cuda 13.0 build matches system driver (CUDA 13.0)
      # swap to cu129 on hosts with older drivers
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.11.0
      - numpy>=2.0
      - scipy
      - scikit-learn
      - rdkit
      # pymatgen 2026.5.x split into a `pymatgen-core` distribution that drops
      # `pymatgen.core.composition` etc. -- avoid until they stabilize.
      - pymatgen<2026.5
      - ase
      - lightning>=2.4
      - tables
      - pygments
      - pyarrow
      - tqdm
      - e3nn
      - torch-geometric==2.7.0
      - wandb
      - tensorboard
      - seaborn
      - bson
      - pandas
      - pytest
      # lmdb >= 2.0 forbids opening the same env path twice in one process,
      # which both repos rely on across test fixtures. Pin until both code
      # paths are refactored.
      - lmdb<2
